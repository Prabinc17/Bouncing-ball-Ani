<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>v48.animation.ball.html Ball-Bounce Animation</title>
    <style>
        .container{
            width: 90vw;
            height: 90vh;
            background-color: blueviolet;
            position: absolute;
            position: relative;

        }
        .ball{
            width: 80px;
            height: 80px;
            background-color: chartreuse;
            border-radius: 50px;
            position: absolute;
            bottom: 0;
            left: 0;
            margin: 10px;
            animation:animateX 10s linear infinite , 
            animateY 1s ease-out infinite alternate ;
            
            

        }


        @keyframes animateX {
            from{
                left: 0;
            }
            to{
                left:90% ;
            }
            
        }
        @keyframes animateY {
            from{
                bottom: 0%;
            }
            to{
                bottom:80% ;
            }
            
        }
        

             
            
        
    </style>
</head>
<body>
    <div class="container">
        <div class="ball"></div>
    </div>
    
</body>
</html>
